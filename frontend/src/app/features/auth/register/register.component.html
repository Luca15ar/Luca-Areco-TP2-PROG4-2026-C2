<main class="auth-shell">
  <div class="auth-card register-card">
    <div class="auth-header">
      <span class="auth-brand">trama<span>.</span></span>
    </div>

    <div class="register-grid">
      <div class="editorial-col">
        <p class="tagline">Bienvenido a trama</p>
        <h1 class="editorial-title">Historias que<br /><em>se quedan contigo.</em></h1>
        <p class="editorial-desc">Un lugar tranquilo para escribir, leer y compartir las pequeñas verdades de cada día.</p>
      </div>

      <form [formGroup]="registerForm" (ngSubmit)="onSubmit()" class="auth-form register-form">
        @if (errorMessage()) {
          <div class="auth-error" role="alert">
            {{ errorMessage() }}
          </div>
        }

        <div class="form-row">
          <label>
            Nombre
            <input formControlName="firstName" placeholder="Tu nombre" />
            @if (registerForm.get('firstName')?.touched && registerForm.get('firstName')?.errors) {
              <small class="field-error">
                @if (registerForm.get('firstName')?.hasError('required')) {
                  El nombre es obligatorio.
                } @else if (registerForm.get('firstName')?.hasError('pattern')) {
                  El nombre solo puede contener letras.
                } @else if (registerForm.get('firstName')?.hasError('minlength')) {
                  El nombre debe tener al menos 2 letras.
                }
              </small>
            }
          </label>
          <label>
            Apellido
            <input formControlName="lastName" placeholder="Tu apellido" />
            @if (registerForm.get('lastName')?.touched && registerForm.get('lastName')?.errors) {
              <small class="field-error">
                @if (registerForm.get('lastName')?.hasError('required')) {
                  El apellido es obligatorio.
                } @else if (registerForm.get('lastName')?.hasError('pattern')) {
                  El apellido solo puede contener letras.
                } @else if (registerForm.get('lastName')?.hasError('minlength')) {
                  El apellido debe tener al menos 2 letras.
                }
              </small>
            }
          </label>
        </div>

        <div class="form-row">
          <label>
            Correo
            <input type="email" formControlName="email" placeholder="nombre@correo.com" />
            @if (registerForm.get('email')?.touched && registerForm.get('email')?.errors) {
              <small class="field-error">
                @if (registerForm.get('email')?.hasError('required')) {
                  El correo electrónico es obligatorio.
                } @else if (registerForm.get('email')?.hasError('email')) {
                  Ingresa un correo electrónico válido.
                }
              </small>
            }
          </label>
          <label>
            Nombre de usuario
            <input formControlName="username" placeholder="como-te-llamas" />
            @if (registerForm.get('username')?.touched && registerForm.get('username')?.errors) {
              <small class="field-error">
                @if (registerForm.get('username')?.hasError('required')) {
                  El nombre de usuario es obligatorio.
                } @else if (registerForm.get('username')?.hasError('minlength')) {
                  El nombre de usuario debe tener al menos 3 caracteres.
                } @else if (registerForm.get('username')?.hasError('pattern')) {
                  Solo letras, números, puntos, guiones y guiones bajos.
                }
              </small>
            }
          </label>
        </div>

        <div class="form-row">
          <label>
            Contraseña
            <div class="password-wrapper">
              <input
                [type]="showPassword() ? 'text' : 'password'"
                formControlName="password"
                placeholder="Mínimo 8 caracteres"
              />
              <button
                type="button"
                class="btn-reveal"
                (click)="showPassword.set(!showPassword())"
                aria-label="Mostrar u ocultar contraseña"
              >
                @if (showPassword()) {
                  <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                    <line x1="1" y1="1" x2="23" y2="23"></line>
                  </svg>
                } @else {
                  <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                    <circle cx="12" cy="12" r="3"></circle>
                  </svg>
                }
              </button>
            </div>
            <span class="field-hint">Mínimo 8 caracteres, 1 mayúscula y 1 número.</span>
            @if (registerForm.get('password')?.touched && registerForm.get('password')?.errors) {
              <small class="field-error">
                @if (registerForm.get('password')?.hasError('required')) {
                  La contraseña es obligatoria.
                } @else if (registerForm.get('password')?.hasError('minlength') || registerForm.get('password')?.hasError('pattern')) {
                  Mínimo 8 caracteres, 1 mayúscula y 1 número.
                }
              </small>
            }
          </label>
          <label>
            Repetir contraseña
            <input type="password" formControlName="repeatPassword" placeholder="Repite tu contraseña" />
            @if ((registerForm.get('repeatPassword')?.touched || registerForm.touched) && (registerForm.get('repeatPassword')?.errors || registerForm.hasError('passwordMismatch'))) {
              <small class="field-error">
                @if (registerForm.get('repeatPassword')?.hasError('required')) {
                  Debes repetir la contraseña.
                } @else if (registerForm.hasError('passwordMismatch')) {
                  Las contraseñas no coinciden.
                }
              </small>
            }
          </label>
        </div>

        <label>
          Fecha de nacimiento
          <input type="date" formControlName="birthdate" />
          @if (registerForm.get('birthdate')?.touched && registerForm.get('birthdate')?.errors) {
            <small class="field-error">
              @if (registerForm.get('birthdate')?.hasError('required')) {
                La fecha de nacimiento es obligatoria.
              }
            </small>
          }
        </label>

        <label>
          Descripción breve
          <textarea formControlName="bio" rows="3" placeholder="Cuéntanos algo sobre ti..."></textarea>
        </label>

        <label class="upload-box">
          <div class="upload-icon-wrapper">
            @if (imagePreview()) {
              <img [src]="imagePreview()" class="avatar-preview" alt="Vista previa" />
            } @else {
              <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                <circle cx="8.5" cy="8.5" r="1.5"></circle>
                <polyline points="21 15 16 10 5 21"></polyline>
              </svg>
            }
          </div>
          <div>
            <strong>Foto de perfil</strong>
            <small>Arrastra una imagen o haz clic para elegirla</small>
          </div>
          <input type="file" (change)="onFileSelected($event)" accept="image/*" />
        </label>

        <button type="submit" class="btn-primary" [disabled]="isLoading()">
          @if (isLoading()) {
            <span>Creando cuenta...</span>
          } @else {
            <span>Crear cuenta</span>
          }
        </button>

        <p class="auth-footer">¿Ya tienes una cuenta? <a routerLink="/login">Inicia sesión</a></p>
      </form>
    </div>
  </div>
</main>
