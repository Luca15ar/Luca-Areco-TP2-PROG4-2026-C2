<main class="auth-shell">
  <div class="auth-card login-card">
    <div class="auth-header">
      <span class="auth-brand">trama<span>.</span></span>
    </div>

    <div class="login-badge-wrapper">
      <div class="brand-circle">t</div>
      <p class="tagline">Qué bueno verte</p>
      <h1 class="editorial-title">Inicia sesión</h1>
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="auth-form">
      <label>
        Usuario o correo
        <input formControlName="login" placeholder="nombre@correo.com" />
        @if (loginForm.get('login')?.touched && loginForm.get('login')?.errors) {
          <small class="field-error">
            @if (loginForm.get('login')?.hasError('required')) {
              El usuario o correo es obligatorio.
            }
          </small>
        }
      </label>

      <label>
        Contraseña
        <div class="password-wrapper">
          <input
            [type]="showPassword() ? 'text' : 'password'"
            formControlName="password"
            placeholder="Tu contraseña"
          />
          <button
            type="button"
            class="btn-reveal"
            (click)="showPassword.set(!showPassword())"
            aria-label="Mostrar u ocultar contraseña"
          >
            @if (showPassword()) {
              <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                <line x1="1" y1="1" x2="23" y2="23"></line>
              </svg>
            } @else {
              <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
            }
          </button>
        </div>
        @if (loginForm.get('password')?.touched && loginForm.get('password')?.errors) {
          <small class="field-error">
            @if (loginForm.get('password')?.hasError('required')) {
              La contraseña es obligatoria.
            }
          </small>
        }
      </label>

      @if (errorMessage()) {
        <div class="auth-error" role="alert">
          {{ errorMessage() }}
        </div>
      }

      <button type="submit" class="btn-primary" [disabled]="isLoading()">
        @if (isLoading()) {
          <span>Iniciando sesión...</span>
        } @else {
          <span>Iniciar sesión</span>
        }
      </button>

      <p class="auth-footer">
        ¿No tienes una cuenta? <a routerLink="/register">Regístrate</a>
      </p>
    </form>
  </div>
</main>
