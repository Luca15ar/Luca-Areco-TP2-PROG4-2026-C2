<header class="navbar-header">
  <div class="navbar-container">
    <a routerLink="/posts" class="navbar-brand">trama<span>.</span></a>

    <div class="navbar-actions">
      <nav class="navbar-links">
        <a routerLink="/posts" routerLinkActive="active">Publicaciones</a>
        @if (authService.isAdmin()) {
          <a routerLink="/admin" routerLinkActive="active">Administración</a>
        }
      </nav>

      <!-- Toggle de modo oscuro/claro con SVG vectoriales (sin emojis) -->
      <button
        type="button"
        class="theme-toggle"
        (click)="toggleTheme()"
        [attr.aria-label]="themeService.currentTheme() === 'dark' ? 'Cambiar a modo claro' : 'Cambiar a modo oscuro'"
      >
        <span class="theme-toggle-icon" [class.active]="themeService.currentTheme() === 'light'">
          <svg viewBox="0 0 24 24" width="14" height="14" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="5"></circle>
            <line x1="12" y1="1" x2="12" y2="3"></line>
            <line x1="12" y1="21" x2="12" y2="23"></line>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
            <line x1="1" y1="12" x2="3" y2="12"></line>
            <line x1="21" y1="12" x2="23" y2="12"></line>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
          </svg>
        </span>
        <span class="theme-toggle-icon" [class.active]="themeService.currentTheme() === 'dark'">
          <svg viewBox="0 0 24 24" width="14" height="14" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
          </svg>
        </span>
      </button>

      <div class="user-menu-wrapper">
        <button type="button" class="user-avatar-btn" (click)="toggleMenu()" aria-label="Menú de usuario">
          @if (authService.currentUser()?.avatarUrl) {
            <img [src]="authService.getAvatarUrl(authService.currentUser()?.avatarUrl)" alt="Avatar" class="avatar-img" />
          } @else {
            <span class="avatar-text">{{ getUserInitials() }}</span>
          }
        </button>

        @if (menuOpen()) {
          <div class="user-dropdown">
            <a routerLink="/profile" (click)="goToProfile()">Mi perfil</a>
            <button type="button" (click)="handleLogout()">Cerrar sesión</button>
          </div>
        }
      </div>
    </div>
  </div>
</header>
