@if (sessionService.showWarningModal()) {
  <aside
    class="session-toast-container"
    role="alert"
    aria-live="assertive"
    aria-labelledby="session-toast-title"
  >
    <div class="session-toast-card">
      <header class="toast-header">
        <div class="title-cluster">
          <svg
            class="sparkle-icon"
            viewBox="0 0 24 24"
            width="22"
            height="22"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path d="M12 3c0 4.5-3.5 8-8 8 4.5 0 8 3.5 8 8 0-4.5 3.5-8 8-8-4.5 0-8-3.5-8-8z"></path>
            <circle cx="5" cy="19" r="1.5" fill="currentColor"></circle>
          </svg>
          <h2 id="session-toast-title" class="toast-title">Tu sesión está por expirar</h2>
        </div>

        <button
          type="button"
          class="btn-close-toast"
          (click)="onClose()"
          aria-label="Cerrar aviso"
          title="Cerrar aviso"
        >
          <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </header>

      <div class="toast-body">
        <p class="toast-description">
          Por tu seguridad, se cerrará la sesión en
          <strong class="countdown-highlight">{{ sessionService.secondsRemaining() }}</strong>
          @if (sessionService.secondsRemaining() === 1) {
            segundo.
          } @else {
            segundos.
          }
        </p>
      </div>

      <footer class="toast-actions">
        <button
          type="button"
          class="btn-primary"
          [disabled]="sessionService.isRefreshing()"
          (click)="onExtend()"
        >
          @if (sessionService.isRefreshing()) {
            <span>Extendiendo...</span>
          } @else {
            <span>Mantener sesión activa</span>
          }
        </button>

        <button
          type="button"
          class="btn-signout"
          [disabled]="sessionService.isRefreshing()"
          (click)="onLogout()"
        >
          <span>Cerrar sesión</span>
        </button>
      </footer>
    </div>
  </aside>
}
